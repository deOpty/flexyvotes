name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: flexyvotes, POSTGRES_USER: flexyvotes, POSTGRES_PASSWORD: flexyvotes}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U flexyvotes" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      SECRET_KEY: ci-only-secret-key-not-for-production
      DATABASE_URL: postgres://flexyvotes:flexyvotes@localhost:5432/flexyvotes
      DATABASE_SSL_REQUIRE: "False"
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y gettext
      - run: pip install -r requirements-dev.txt
      - name: Compile translations
        run: python manage.py compilemessages
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
      - name: Deployment checks
        run: DEBUG=False python manage.py check --deploy --fail-level ERROR
      - name: Tests (PostgreSQL, incl. race-condition tests)
        run: python manage.py test --parallel 1 -v 2

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt
      - name: SAST (Bandit)
        run: bandit -c pyproject.toml -r core elections payments fraud notifications billing api voting vote_fund
      - name: Dependency scan (pip-audit)
        run: pip-audit -r requirements.txt --strict

  container:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t flexyvotes:ci .
      - name: Container scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: flexyvotes:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Start stack for DAST
        run: |
          cp .env.example .env
          echo "SECRET_KEY=dast-secret-key-$(date +%s)" >> .env
          echo "DEBUG=False" >> .env
          echo "ALLOWED_HOSTS=localhost,127.0.0.1,web" >> .env
          IMAGE=flexyvotes:ci docker compose up -d db redis web
          for i in $(seq 1 60); do curl -fsS http://localhost:8000/healthz/live && break; sleep 2; done
      - name: DAST (OWASP ZAP baseline)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:8000
          rules_file_name: .zap/rules.tsv
          fail_action: true
