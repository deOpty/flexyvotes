global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: flexyvotes
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token   # same value as METRICS_TOKEN
    static_configs:
      - targets: ['web:8000']
