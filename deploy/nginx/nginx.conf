worker_processes auto;
events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 25m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    log_format main '$remote_addr - "$request" $status $body_bytes_sent $request_time '
                    'rid=$request_id ua="$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # Edge rate limiting (the application enforces finer-grained limits too).
    # Shared egress addresses - a campus or office NAT where hundreds of
    # voters appear as one IP - are listed in trusted_nat.conf and exempted:
    # an empty key is never limited. The app's per-voter limits still apply.
    geo $edge_limited {
        default 1;
        include /etc/nginx/trusted_nat.conf;
    }
    map $edge_limited $edge_key {
        0       "";
        default $binary_remote_addr;
    }
    limit_req_zone $edge_key zone=general:20m rate=20r/s;
    limit_req_zone $edge_key zone=auth:10m rate=10r/m;
    # One voter makes ~7 requests (sign in, ballot, review, cast, receipt).
    limit_req_zone $edge_key zone=vote:20m rate=300r/m;
    limit_conn_zone $edge_key zone=perip:10m;
    limit_req_status 429;

    upstream app {
        least_conn;
        server web:8000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location /healthz/ { proxy_pass http://app; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:20m;
        ssl_session_timeout 1d;
        ssl_stapling on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        limit_conn perip 50;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;

        location /static/ {
            proxy_pass http://app;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        location ~ ^/(login|register|account/mfa|password_reset)/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://app;
        }
        location ~ ^/(e/[0-9]+/(vote|pay)|api/v1/elections/[0-9]+/(vote|ballot|payments)) {
            limit_req zone=vote burst=20 nodelay;
            proxy_pass http://app;
        }
        location = /metrics {
            # Scraped from inside the VPC only.
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://app;
        }
        location / {
            limit_req zone=general burst=40 nodelay;
            proxy_pass http://app;
        }
    }
}
