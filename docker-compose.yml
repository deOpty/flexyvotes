# Full local stack: PostgreSQL, Redis, web (gunicorn), Celery worker + beat, pgAdmin.
#   docker compose up --build
#   docker compose run --rm web python manage.py test        (tests on PostgreSQL)
x-app: &app
  build:
    context: .
    args:
      INSTALL_DEV: "true"
      APP_VERSION: ${APP_VERSION:-dev}
  image: ${IMAGE:-flexyvotes:local}
  env_file:
    - .env
  environment: &app-env
    DATABASE_URL: postgres://flexyvotes:flexyvotes@db:5432/flexyvotes
    DATABASE_SSL_REQUIRE: "False"
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    PORT: ${PORT:-8000}
    PRIVATE_MEDIA_ROOT: /app/private_media
  volumes:
    - media_data:/app/media
    - private_media:/app/private_media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: flexyvotes
      POSTGRES_USER: flexyvotes
      POSTGRES_PASSWORD: flexyvotes
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flexyvotes"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    <<: *app
    command: ["web"]
    ports:
      - "${PORT:-8000}:${PORT:-8000}"

  worker:
    <<: *app
    command: ["worker"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    healthcheck:
      test: ["CMD-SHELL", "celery -A vote_fund inspect ping -t 5 >/dev/null 2>&1"]
      interval: 60s
      timeout: 15s
      retries: 3

  beat:
    <<: *app
    command: ["beat"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    healthcheck:
      disable: true

  # Web UI for the database. Restrict PGADMIN_PORT to admin IPs (security
  # group / firewall) - see docs/DEPLOYMENT.md.
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me-now}
      PGADMIN_CONFIG_WTF_CSRF_TIME_LIMIT: "None"
      # Unique cookie name so another pgAdmin on the same host can't clobber the session.
      PGADMIN_CONFIG_SESSION_COOKIE_NAME: "'flexyvotes_pga_session'"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["admin"]

volumes:
  postgres_data:
  redis_data:
  media_data:
  private_media:
  pgadmin_data:
