services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: flexyvotes
      POSTGRES_USER: flexyvotes
      POSTGRES_PASSWORD: flexyvotes
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flexyvotes"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://flexyvotes:flexyvotes@db:5432/flexyvotes
      DATABASE_SSL_REQUIRE: "False"
      PORT: ${PORT:-8000}
    volumes:
      - media_data:/app/media
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy

  # Web UI for administering the `db` Postgres instance directly.
  # SECURITY: restrict access at the network level (security group /
  # firewall allow-list of admin IPs only) - this serves a database login
  # over plain HTTP unless you put TLS in front of it. See DEPLOYMENT.md.
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  pgadmin_data:
