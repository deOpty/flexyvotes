{% extends 'voting/base.html' %}
{% load i18n %}
{% block title %}{% translate "Change password" %}{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 520px;">
    <h1 class="h3 fw-bold text-wine">{% translate "Change password" %}</h1>
    <form method="post" class="card border-0 shadow-sm rounded-4 p-4">{% csrf_token %}
        {% for field in form %}
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        <input type="password" name="{{ field.html_name }}" id="{{ field.id_for_label }}" class="form-control mb-1" autocomplete="{% if field.name == 'old_password' %}current-password{% else %}new-password{% endif %}" required>
        {% for error in field.errors %}<div class="text-danger small mb-2" role="alert">{{ error }}</div>{% endfor %}
        <div class="mb-3"></div>
        {% endfor %}
        <button class="btn btn-wine w-100">{% translate "Change password" %}</button>
    </form>
</div>
{% endblock %}
