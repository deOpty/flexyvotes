{% extends 'voting/base.html' %}
{% load i18n %}
{% block content %}
<div class="container py-5 text-center" style="max-width: 640px;">
    <div class="display-1 fw-bold text-wine">{% block code %}{% endblock %}</div>
    <h1 class="h3 fw-bold mb-3">{% block heading %}{% endblock %}</h1>
    <p class="text-muted">{% block message %}{% endblock %}</p>
    <a href="/" class="btn btn-wine mt-3">{% translate "Back to home" %}</a>
</div>
{% endblock %}
