{% extends 'voting/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-5">
                <h3 class="mb-4 text-center text-wine fw-bold">Reset Password</h3>
                <p class="text-muted small text-center mb-4">Enter your email address and we will send you a link to reset your password.</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <input type="email" name="email" class="form-control" placeholder="Email Address" required>
                    </div>
                    <button type="submit" class="btn btn-wine w-100 py-2 fw-bold">Send Reset Link</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{% url 'login' %}" class="text-muted small text-decoration-none">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
