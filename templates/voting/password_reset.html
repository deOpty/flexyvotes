{% extends 'voting/base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center py-5 my-md-4">
    <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="card shadow-soft border-0 rounded-4xl overflow-hidden reveal">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="icon-circle mb-3" style="width:64px;height:64px;">
                        <i class="bi bi-key-fill fs-3"></i>
                    </span>
                    <p class="section-eyebrow mb-1">Account Recovery</p>
                    <h3 class="mb-2 fw-bold font-display">Reset your password</h3>
                    <p class="text-muted small mb-0">Enter your email address and we will send you a link to reset your password.</p>
                </div>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope-fill text-wine"></i></span>
                            <input type="email" name="email" class="form-control border-start-0 ps-0" placeholder="you@example.com" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-wine w-100 py-2 fw-bold">Send Reset Link</button>
                </form>
                <div class="text-center mt-4">
                    <a href="{% url 'login' %}" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
