{% extends 'voting/base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center py-5 my-md-4">
    <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="card shadow-soft border-0 rounded-4xl overflow-hidden reveal">
            <div class="card-body p-4 p-md-5 text-center">
                <span class="icon-circle mb-3" style="width:72px;height:72px;">
                    <i class="bi bi-envelope-check-fill fs-2"></i>
                </span>
                <p class="section-eyebrow mb-1">Almost There</p>
                <h3 class="mb-3 fw-bold font-display">Check your email</h3>
                <p class="text-muted mb-4">If an account with that email exists, a password reset link has been sent.</p>
                <a href="{% url 'login' %}" class="btn btn-outline-wine px-4">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
