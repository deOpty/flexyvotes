{% extends 'voting/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-5 text-center">
                <i class="bi bi-envelope-check fs-1 text-wine mb-3"></i>
                <h3 class="mb-3 text-wine fw-bold">Check Your Email</h3>
                <p class="text-muted">If an account with that email exists, a password reset link has been sent.</p>
                <a href="{% url 'login' %}" class="btn btn-outline-secondary mt-3">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
