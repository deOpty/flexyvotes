{% extends 'voting/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 mt-4 rounded-4">
            <div class="card-body p-5">
                <h3 class="mb-4 text-wine fw-bold">Edit Candidate: {{ candidate.name }}</h3>
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small">Name</label>
                        <input type="text" name="name" class="form-control" value="{{ candidate.name }}" required>
                    </div>
                    
                 <div class="mb-3">
                     <label class="form-label fw-bold text-muted small">Nominee Code</label>
                     <input type="text" name="nominee_code" class="form-control" value="{{ candidate.nominee_code|default_if_none:'' }}">
                     <small class="text-muted">Leave blank to auto-generate a new code.</small>
                 </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small">Bio</label>
                        <textarea name="bio" class="form-control" rows="3">{{ candidate.bio }}</textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small">Category</label>
                        <select name="category" class="form-select">
                            <option value="">None</option>
                            {% for cat in event.categories.all %}
                                <option value="{{ cat.id }}" {% if candidate.category.id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small">Image (Leave blank to keep current)</label>
                        {% if candidate.image %}
                            <small class="d-block mb-2 text-muted">Current image: {{ candidate.image.name }}</small>
                        {% endif %}
                        <input type="file" name="image" class="form-control" accept="image/*">
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-wine flex-grow-1 py-2 fw-bold">Save Changes</button>
                        <a href="{% url 'event_detail' event.id %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
