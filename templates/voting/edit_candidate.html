{% extends 'voting/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">

        <div class="mb-4 reveal">
            <span class="section-eyebrow">Organizer Tools</span>
            <h2 class="fw-bold text-wine mb-1 mt-1"><i class="bi bi-person-badge me-2"></i>Edit Candidate</h2>
            <p class="text-muted mb-0">{{ candidate.name }}</p>
        </div>

        <div class="card shadow-soft border-0 rounded-4xl reveal">
            <div class="card-body p-4 p-md-5">
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="row g-3 mb-3">
                        <div class="col-md-7">
                            <label class="form-label">Name</label>
                            <input type="text" name="name" class="form-control" value="{{ candidate.name }}" required>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label">Nominee Code</label>
                            <input type="text" name="nominee_code" class="form-control" value="{{ candidate.nominee_code|default_if_none:'' }}">
                            <small class="text-muted tiny">Leave blank to auto-generate a new code.</small>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Bio</label>
                        <textarea name="bio" class="form-control" rows="3">{{ candidate.bio }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select name="category" class="form-select">
                            <option value="">None</option>
                            {% for cat in event.categories.all %}
                                <option value="{{ cat.id }}" {% if candidate.category.id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-1">
                        <label class="form-label">Photo</label>
                        {% if candidate.image %}
                            <div class="d-flex align-items-center gap-2 mb-2 p-2 rounded-3" style="background-color: var(--ink-50);">
                                <img src="{{ candidate.image.url }}" alt="{{ candidate.name }}" class="rounded-2" style="width:44px;height:44px;object-fit:cover;">
                                <small class="text-muted text-truncate">Current: {{ candidate.image.name }}</small>
                            </div>
                        {% endif %}
                        <input type="file" name="image" class="form-control" accept="image/*">
                        <small class="text-muted tiny">Leave blank to keep current image.</small>
                    </div>

                    <div class="d-flex flex-column-reverse flex-sm-row gap-2 mt-4">
                        <a href="{% url 'event_detail' event.id %}" class="btn btn-outline-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-wine flex-grow-1 py-2 fw-bold"><i class="bi bi-check-circle me-2"></i>Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
