{% extends 'voting/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 mt-4 rounded-4">
            <div class="card-body p-5">
                <h3 class="mb-4 text-wine fw-bold"><i class="bi bi-plus-circle me-2"></i>Add New Product</h3>
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small">Product Name</label>
                        <input type="text" name="name" class="form-control" placeholder="e.g., Gold Star Plaque" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small">Description</label>
                        <textarea name="description" class="form-control" rows="3" placeholder="Describe the product..."></textarea>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-muted small">Category</label>
                            <select name="category" class="form-select">
                                <option value="">None</option>
                                {% for cat in categories %}
                                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold text-muted small">Price (₵)</label>
                            <input type="number" name="price" class="form-control" step="0.01" placeholder="50.00" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold text-muted small">Old Price (₵) <small>(Optional)</small></label>
                            <input type="number" name="old_price" class="form-control" step="0.01" placeholder="75.00">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small">Product Image</label>
                        <input type="file" name="image" class="form-control" accept="image/*" required>
                    </div>
                    
                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" type="checkbox" name="is_active" id="flexSwitchCheckChecked" checked>
                        <label class="form-check-label text-muted small fw-bold" for="flexSwitchCheckChecked">Active (Show in store)</label>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-wine flex-grow-1 py-2 fw-bold">Save Product</button>
                        <a href="{% url 'manage_store' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
