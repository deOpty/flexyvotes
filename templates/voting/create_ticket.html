{% extends 'voting/base.html' %} {% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-lg-10">
    <div class="mb-4 reveal">
      <span class="section-eyebrow">Organizer Tools</span>
      <h2 class="fw-bold text-wine mb-1 mt-1">
        <i class="bi bi-ticket-perforated me-2"></i>Add Ticket Type
      </h2>
      <p class="text-muted mb-0">For event: <b>{{ event.title }}</b></p>
    </div>

    <div class="row g-4">
      <!-- Left: Form -->
      <div class="col-lg-6">
        <div class="card shadow-soft border-0 rounded-4xl h-100 reveal">
          <div class="card-body p-4 p-md-5">
            <form
              method="POST"
              enctype="multipart/form-data">
              {% csrf_token %}

              <div class="mb-3">
                <label class="form-label">Ticket Name</label>
                <input
                  type="text"
                  name="name"
                  id="name-input"
                  class="form-control"
                  placeholder="e.g., VIP"
                  required
                  oninput="updatePreview()" />
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label">Price (GHS)</label>
                  <input
                    type="number"
                    name="price"
                    id="price-input"
                    class="form-control"
                    step="0.1"
                    min="0.1"
                    placeholder="50.00"
                    required
                    oninput="updatePreview()" />
                </div>
                <div class="col-md-6">
                  <label class="form-label"
                    >Old Price
                    <span class="text-muted fw-normal">(Optional)</span></label
                  >
                  <input
                    type="number"
                    name="old_price"
                    id="old-price-input"
                    class="form-control"
                    step="0.1"
                    min="0.1"
                    placeholder="75.00"
                    oninput="updatePreview()" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Quantity Available</label>
                  <input
                    type="number"
                    name="quantity_available"
                    class="form-control"
                    value="100"
                    min="1"
                    required />
                </div>
              </div>

              <div class="mb-1">
                <label class="form-label"
                  >Ticket Image
                  <span class="text-muted fw-normal">(Optional)</span></label
                >
                <input
                  type="file"
                  name="image"
                  id="image-input"
                  class="form-control"
                  accept="image/*"
                  onchange="updatePreview()" />
              </div>

              <div class="d-flex flex-column-reverse flex-sm-row gap-2 mt-4">
                <a
                  href="{% url 'event_detail' event.id %}"
                  class="btn btn-outline-secondary px-4"
                  >Cancel</a
                >
                <button
                  type="submit"
                  class="btn btn-wine flex-grow-1 py-2 fw-bold">
                  <i class="bi bi-check-circle me-2"></i>Add Ticket
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Right: Live Preview -->
      <div class="col-lg-6">
        <label class="form-label mb-2">Live Preview</label>
        <div
          class="card shadow-soft border-0 rounded-4xl overflow-hidden reveal reveal-delay-1"
          style="background-color: var(--ink-50)">
          <div class="card-body p-0">
            <div
              id="preview-banner"
              class="text-white p-3 position-relative"
              style="background-color: {{ event.primary_color }}; min-height: 100px;">
              <div
                class="position-relative d-flex justify-content-between align-items-center">
                <div>
                  <h6
                    class="fw-bold mb-0"
                    style="color: {{ event.accent_color }};">
                    {{ event.title }}
                  </h6>
                  <small style="color: #fff; opacity: 0.9"
                    >{{ event.start_date|date:"M j, Y" }}</small
                  >
                </div>
                <i
                  class="bi bi-ticket-perforated-fill fs-3"
                  style="color: {{ event.accent_color }};"></i>
              </div>
            </div>
            <div class="p-4 text-center">
              <small
                class="text-muted text-uppercase fw-bold"
                style="font-size: 0.6rem"
                >Official Guest Pass</small
              >
              <h5
                id="preview-name"
                class="fw-bold text-dark mb-1 mt-1">
                Ticket Name
              </h5>
              <h4
                id="preview-price"
                class="text-wine mb-0">
                GHS 0.00
              </h4>
              <div class="mt-3">
                <img
                  id="preview-image"
                  src="https://via.placeholder.com/80x80?text=Image"
                  alt="Ticket Image"
                  style="
                    width: 80px;
                    height: 80px;
                    object-fit: cover;
                    border-radius: 10px;
                    display: none;
                  " />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function updatePreview() {
    // Update Name
    const name = document.getElementById('name-input').value || 'Ticket Name';
    document.getElementById('preview-name').innerText = name;

    // Update Price
    const price = document.getElementById('price-input').value || '0.00';
    const oldPrice = document.getElementById('old-price-input').value;

    const priceEl = document.getElementById('preview-price');
    if (oldPrice) {
      priceEl.innerHTML = `<span style="text-decoration: line-through; color: #999; font-size: 0.8em;">GHS ₵{oldPrice}</span> GHS ₵{price}`;
    } else {
      priceEl.innerText = 'GHS ' + price;
    }
    // Update Image
    const imageInput = document.getElementById('image-input');
    const previewImage = document.getElementById('preview-image');
    if (imageInput.files && imageInput.files[0]) {
      const reader = new FileReader();
      reader.onload = function (e) {
        previewImage.src = e.target.result;
        previewImage.style.display = 'inline-block';
      };
      reader.readAsDataURL(imageInput.files[0]);
    } else {
      previewImage.style.display = 'none';
    }
  }
</script>
{% endblock %}
