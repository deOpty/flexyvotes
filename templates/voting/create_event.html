{% extends 'voting/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm mt-4 rounded-4">
            <div class="card-body p-5">
                <h3 class="mb-4 text-wine fw-bold">Create New Event</h3>
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small">Event Title</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small">Description</label>
                        <textarea name="description" class="form-control" rows="3"></textarea>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-muted small">Start Date & Time</label>
                            <input type="datetime-local" name="start_date" class="form-control" required>
                            <small class="text-muted">Make sure to select both Date and Time.</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-muted small">End Date & Time</label>
                            <input type="datetime-local" name="end_date" class="form-control" required>
                            <small class="text-muted">Make sure to select both Date and Time.</small>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-muted small">Voting Mode</label>
                            <select name="voting_mode" id="votingModeSelect" class="form-select" onchange="toggleCodeMode()">
                                <option value="Pay to Vote">Pay to Vote (Fundraising)</option>
                                <option value="Code Voting">Code Voting (Free / Fair)</option>
                            </select>
                        </div>
                        <div class="col-md-6" id="codeModeDiv" style="display: none;">
                            <label class="form-label fw-bold text-muted small">Code Voting Type</label>
                            <select name="code_voting_mode" id="codeModeSelect" class="form-select">
                                <option value="Standard">Standard Codes (No ID required)</option>
                                <option value="Student ID">Student ID + Code (Secure)</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small">Platform Fee (%)</label>
                        <input type="number" name="platform_fee_percentage" class="form-control" value="20.00" step="0.01" required>
                    </div>
                    
                    <hr class="my-4">
                    <h5 class="text-wine">Event Theme Colours</h5>
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-muted small">Primary Colour</label>
                            <input type="color" name="primary_color" class="form-control form-control-color w-100" value="#800020" style="height: 40px;">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-muted small">Accent Colour</label>
                            <input type="color" name="accent_color" class="form-control form-control-color w-100" value="#FFD700" style="height: 40px;">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small">Background Image (Optional)</label>
                        <input type="file" name="background_image" class="form-control" accept="image/*">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small">Event Flyer/Image (Shows on Home Page)</label>
                        <input type="file" name="event_image" class="form-control" accept="image/*">
                    </div>
                    
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-wine flex-grow-1 py-2 fw-bold">Create Event</button>
                        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript to show/hide Code Mode -->
<script>
    function toggleCodeMode() {
        const mode = document.getElementById('votingModeSelect').value;
        const codeDiv = document.getElementById('codeModeDiv');
        if (mode === 'Code Voting') {
            codeDiv.style.display = 'block';
        } else {
            codeDiv.style.display = 'none';
        }
    }

</script>
{% endblock %}
