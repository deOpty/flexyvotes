{% extends 'voting/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-5 text-center">
                <i class="bi bi-check-circle-fill fs-1 text-success mb-3"></i>
                <h3 class="mb-3 text-wine fw-bold">Password Reset!</h3>
                <p class="text-muted">Your password has been set successfully. You can now log in with your new password.</p>
                <a href="{% url 'login' %}" class="btn btn-wine mt-3 px-4">Log In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
