{% extends 'voting/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-soft border-0 rounded-4xl reveal">
            <div class="card-body p-5 text-center">
                <span class="icon-circle bg-wine text-gold mx-auto mb-3" style="width: 64px; height: 64px;">
                    <i class="bi bi-phone fs-3"></i>
                </span>
                <h3 class="fw-bold text-wine mb-2">Retrieve E-Ticket</h3>
                <p class="text-muted small mb-4">Bought your ticket via USSD? Enter your Phone Number or Ticket Reference below to view your ticket.</p>

                <form method="POST">
                    {% csrf_token %}
                    <div class="input-group input-group-lg mb-1">
                        <input type="text" name="phone_or_ref" class="form-control" placeholder="e.g., 233500000000 or TK-AB1234" required>
                        <button class="btn btn-wine" type="submit">View Ticket</button>
                    </div>
                </form>

                {% if error_message %}
                <div class="alert alert-danger mt-4 text-start">
                    <i class="bi bi-x-circle-fill me-2"></i>{{ error_message }}
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
