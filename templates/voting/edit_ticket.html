{% extends 'voting/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 mt-4 rounded-4">
            <div class="card-body p-5">
                <h3 class="mb-4 text-wine fw-bold"><i class="bi bi-pencil-square me-2"></i>Edit Ticket</h3>
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small">Ticket Name</label>
                        <input type="text" name="name" class="form-control" value="{{ ticket.name }}" required>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-muted small">Price (GHS)</label>
                            <input type="number" name="price" class="form-control" step="0.01" value="{{ ticket.price }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-muted small">Old Price (GHS)</label>
                            <input type="number" name="old_price" class="form-control" step="0.01" value="{{ ticket.old_price|default_if_none:'' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-muted small">Quantity Available</label>
                            <input type="number" name="quantity_available" class="form-control" value="{{ ticket.quantity_available }}" min="0" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small">Ticket Image (Leave blank to keep current)</label>
                        {% if ticket.image %}
                            <small class="d-block mb-2 text-muted">Current image: {{ ticket.image.name }}</small>
                        {% endif %}
                        <input type="file" name="image" class="form-control" accept="image/*">
                    </div>
                    
                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" type="checkbox" name="is_active" id="flexSwitchCheckChecked" {% if ticket.is_active %}checked{% endif %}>
                        <label class="form-check-label text-muted small fw-bold" for="flexSwitchCheckChecked">Active (Uncheck if Sold Out or Promo Expired)</label>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-wine flex-grow-1 py-2 fw-bold">Save Changes</button>
                        <a href="{% url 'event_detail' event.id %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
