{% extends 'voting/base.html' %} {% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="mb-4 reveal">
      <span class="section-eyebrow">Organizer Tools</span>
      <h2 class="fw-bold text-wine mb-1 mt-1">
        <i class="bi bi-pencil-square me-2"></i>Edit Ticket
      </h2>
      <p class="text-muted mb-0">{{ ticket.name }}</p>
    </div>

    <div class="card shadow-soft border-0 rounded-4xl reveal">
      <div class="card-body p-4 p-md-5">
        <form
          method="POST"
          enctype="multipart/form-data">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label">Ticket Name</label>
            <input
              type="text"
              name="name"
              class="form-control"
              value="{{ ticket.name }}"
              required />
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label">Price (GHS)</label>
              <input
                type="number"
                name="price"
                class="form-control"
                step="0.1"
                min="0.1"
                value="{{ ticket.price }}"
                required />
            </div>
            <div class="col-md-4">
              <label class="form-label">Old Price (GHS)</label>
              <input
                type="number"
                name="old_price"
                class="form-control"
                step="0.1"
                min="0.1"
                value="{{ ticket.old_price|default_if_none:'' }}" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Quantity Available</label>
              <input
                type="number"
                name="quantity_available"
                class="form-control"
                value="{{ ticket.quantity_available }}"
                min="0.1"
                required />
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label">Ticket Image</label>
            {% if ticket.image %}
            <div
              class="d-flex align-items-center gap-2 mb-2 p-2 rounded-3"
              style="background-color: var(--ink-50)">
              <img
                src="{{ ticket.image.url }}"
                alt="{{ ticket.name }}"
                class="rounded-2"
                style="width: 44px; height: 44px; object-fit: cover" />
              <small class="text-muted text-truncate"
                >Current: {{ ticket.image.name }}</small
              >
            </div>
            {% endif %}
            <input
              type="file"
              name="image"
              class="form-control"
              accept="image/*" />
            <small class="text-muted tiny"
              >Leave blank to keep current image.</small
            >
          </div>

          <div class="form-check form-switch p-0 ps-1 mb-1">
            <div
              class="d-flex align-items-center gap-3 p-3 rounded-3"
              style="background-color: var(--ink-50)">
              <input
                class="form-check-input flex-shrink-0 m-0"
                type="checkbox"
                name="is_active"
                id="flexSwitchCheckChecked"
                style="width: 2.75rem; height: 1.5rem"
                {%
                if
                ticket.is_active
                %}checked{%
                endif
                %} />
              <label
                class="form-check-label fw-semibold mb-0"
                for="flexSwitchCheckChecked">
                Active
                <span class="d-block text-muted tiny fw-normal"
                  >Uncheck if sold out or promo expired</span
                >
              </label>
            </div>
          </div>

          <div class="d-flex flex-column-reverse flex-sm-row gap-2 mt-4">
            <a
              href="{% url 'event_detail' event.id %}"
              class="btn btn-outline-secondary px-4"
              >Cancel</a
            >
            <button
              type="submit"
              class="btn btn-wine flex-grow-1 py-2 fw-bold">
              <i class="bi bi-check-circle me-2"></i>Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
