{% extends 'voting/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 mt-4 rounded-4">
            <div class="card-body p-5">
                <h3 class="mb-4 text-wine fw-bold"><i class="bi bi-pencil-square me-2"></i>Edit Product</h3>
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small">Product Name</label>
                        <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small">Description</label>
                        <textarea name="description" class="form-control" rows="3">{{ product.description }}</textarea>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-muted small">Category</label>
                            <select name="category" class="form-select">
                                <option value="">None</option>
                                {% for cat in categories %}
                                    <option value="{{ cat.id }}" {% if product.category.id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold text-muted small">Price (₵)</label>
                            <input type="number" name="price" class="form-control" step="0.01" value="{{ product.price }}" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold text-muted small">Old Price (₵)</label>
                            <input type="number" name="old_price" class="form-control" step="0.01" value="{{ product.old_price|default_if_none:'' }}">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small">Product Image (Leave blank to keep current)</label>
                        {% if product.image %}
                            <small class="d-block mb-2 text-muted">Current image: {{ product.image.name }}</small>
                        {% endif %}
                        <input type="file" name="image" class="form-control" accept="image/*">
                    </div>
                    
                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" type="checkbox" name="is_active" id="flexSwitchCheckChecked" {% if product.is_active %}checked{% endif %}>
                        <label class="form-check-label text-muted small fw-bold" for="flexSwitchCheckChecked">Active (Show in store)</label>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-wine flex-grow-1 py-2 fw-bold">Save Changes</button>
                        <a href="{% url 'manage_store' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
