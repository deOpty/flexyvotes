{% extends 'voting/base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center py-5 my-md-4">
    <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="card shadow-soft border-0 rounded-4xl overflow-hidden reveal">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="icon-circle mb-3" style="width:64px;height:64px;">
                        <i class="bi bi-shield-check fs-3"></i>
                    </span>
                    <p class="section-eyebrow mb-1">Account Recovery</p>
                    <h3 class="mb-0 fw-bold font-display">Set a new password</h3>
                </div>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password" name="new_password1" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm New Password</label>
                        <input type="password" name="new_password2" class="form-control" required>
                    </div>
                    {% if form.errors %}
                        <div class="alert alert-danger small d-flex align-items-start gap-2">
                            <i class="bi bi-exclamation-circle-fill mt-1"></i>
                            <div>{{ form.errors }}</div>
                        </div>
                    {% endif %}
                    <button type="submit" class="btn btn-wine w-100 py-2 fw-bold mt-2">Update Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
