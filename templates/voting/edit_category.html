{% extends 'voting/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="mb-4 text-center reveal">
            <span class="icon-circle mx-auto mb-3" style="width:56px;height:56px;"><i class="bi bi-tags fs-4"></i></span>
            <h3 class="fw-bold text-wine mb-0">Edit Category</h3>
        </div>

        <div class="card shadow-soft border-0 rounded-4xl reveal">
            <div class="card-body p-4 p-md-5">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label">Category Name</label>
                        <input type="text" name="name" class="form-control" value="{{ category.name }}" required>
                    </div>
                    <div class="d-flex flex-column-reverse flex-sm-row gap-2">
                        <a href="{% url 'event_detail' event.id %}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-wine flex-grow-1 fw-bold"><i class="bi bi-check-circle me-2"></i>Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
