{% extends 'voting/base.html' %}

{% block content %}
<div class="container text-center mt-5 pt-5">
    <div class="mx-auto reveal" style="max-width: 420px;">
        <span class="icon-circle bg-wine text-gold mx-auto mb-4" style="width: 84px; height: 84px;">
            <i class="bi bi-check-lg" style="font-size: 2.5rem;"></i>
        </span>
        <h3 class="fw-bold text-wine mb-2">Payment Successful!</h3>
        <p class="text-muted mb-4">Redirecting you back to the event...</p>
        <div class="spinner-border text-wine" role="status" style="width: 2rem; height: 2rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
</div>

<!-- Fallback auto-redirect script -->
<script>
    setTimeout(function() {
        window.location.href = "{% url 'home' %}";
    }, 3000);
</script>
{% endblock %}
