{% extends 'voting/base.html' %}

{% block content %}
<div class="container text-center mt-5">
    <div class="spinner-border text-wine" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <h3 class="mt-3 text-wine">Payment Successful!</h3>
    <p class="text-muted">Redirecting you back to the event...</p>
</div>

<!-- Fallback auto-redirect script -->
<script>
    setTimeout(function() {
        window.location.href = "{% url 'home' %}";
    }, 3000);
</script>
{% endblock %}
