{% extends 'voting/base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center py-5 my-md-4">
    <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="card shadow-soft border-0 rounded-4xl overflow-hidden reveal">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="icon-circle mb-3" style="width:64px;height:64px;">
                        <i class="bi bi-person-plus-fill fs-3"></i>
                    </span>
                    <p class="section-eyebrow mb-1">Get Started</p>
                    <h3 class="mb-1 fw-bold font-display">Create your account</h3>
                    <p class="text-muted small mb-0">Start hosting premium voting events</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person-fill text-wine"></i></span>
                            <input type="text" name="username" class="form-control border-start-0 ps-0" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope-fill text-wine"></i></span>
                            <input type="email" name="email" class="form-control border-start-0 ps-0" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill text-wine"></i></span>
                            <input type="password" name="password" class="form-control border-start-0 ps-0" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-wine w-100 py-2 fw-bold">Register</button>
                </form>

                <hr class="my-4">
                <p class="text-center mb-0 small text-muted">
                    Already have an account? <a href="{% url 'login' %}" class="text-wine fw-bold text-decoration-none">Login here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
